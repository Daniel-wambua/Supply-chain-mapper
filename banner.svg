  </defs>
  <rect width="100%" height="100%" fill="#0f172a" rx="20" ry="20" />
  <path d="M 50 100 L 150 100 M 100 50 L 100 150" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round" filter="url(#shadow)" />
  <circle cx="100" cy="100" r="30" fill="none" stroke="url(#grad1)" stroke-width="6" filter="url(#shadow)" />
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" filter="url(#shadow)">
